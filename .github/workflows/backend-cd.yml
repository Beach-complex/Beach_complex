name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - build.gradle
      - settings.gradle
      - gradle/**
      - gradlew
      - gradlew.bat
      - Dockerfile
      - docker-compose.yml
      - src/main/resources/**
      - .github/workflows/backend-cd.yml
  workflow_dispatch:

concurrency:
  group: backend-cd-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: github.ref != 'refs/heads/chore/rds-runtime-diagnose'
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.image-meta.outputs.image_repository }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive image metadata
        id: image-meta
        shell: bash
        run: |
          owner_lower=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_lower=$(echo "${repo_name}" | tr '[:upper:]' '[:lower:]')
          image_repository="${REGISTRY}/${owner_lower}/${repo_lower}-backend"

          echo "image_repository=${image_repository}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest는 현재 배포 기준점으로 쓰고, SHA 태그는 특정 이미지 추적과 롤백에 사용한다.
          tags: |
            ${{ steps.image-meta.outputs.image_repository }}:latest
            ${{ steps.image-meta.outputs.image_repository }}:${{ steps.image-meta.outputs.image_tag }}

  deploy-to-ec2:
    if: github.ref != 'refs/heads/chore/rds-runtime-diagnose'
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      IMAGE_REPOSITORY: ${{ needs.build-and-push.outputs.image_repository }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      EC2_COMPOSE_FILE: ${{ secrets.EC2_COMPOSE_FILE }}
      EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}

    steps:
      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || '22' }}
          envs: IMAGE_REPOSITORY,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,EC2_DEPLOY_PATH,EC2_COMPOSE_FILE,EC2_ENV_FILE
          script: |
            set -eu

            cd "${EC2_DEPLOY_PATH}"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            export APP_RUNTIME_ENV_FILE="${EC2_ENV_FILE}"

            docker compose -f "${EC2_COMPOSE_FILE}" pull app
            docker compose -f "${EC2_COMPOSE_FILE}" up -d app

            for i in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health; then
                exit 0
              fi
              sleep 2
            done

            docker compose -f "${EC2_COMPOSE_FILE}" ps
            docker logs --tail 200 beach-complex-backend || true
            exit 1

  diagnose-ec2:
    if: github.ref == 'refs/heads/chore/rds-runtime-diagnose'
    name: Diagnose EC2 Runtime (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DNS, container, and AWS role over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT != '' && secrets.EC2_PORT || '22' }}
          script: |
            set -u

            target_db_host='beach-db.ckl6ckmuclfy.us-east-1.rds.amazonaws.com'

            echo '== DNS resolver =='
            sed -n '1,20p' /etc/resolv.conf
            getent ahosts github.com >/dev/null && echo 'public DNS: OK' || echo 'public DNS: FAIL'
            getent ahosts "${target_db_host}" || echo 'target RDS DNS: NOT FOUND'

            echo '== Backend container =='
            docker ps -a --filter name=beach-complex-backend --format 'name={{.Names}} image={{.Image}} status={{.Status}}'
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8081/actuator/health || true

            echo '== EC2 IAM / RDS inventory =='
            imds_token=$(curl --silent --show-error --max-time 3 -X PUT \
              -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
              http://169.254.169.254/latest/api/token || true)
            role_name=''
            if [ -n "${imds_token}" ]; then
              role_name=$(curl --silent --show-error --max-time 3 \
                -H "X-aws-ec2-metadata-token: ${imds_token}" \
                http://169.254.169.254/latest/meta-data/iam/security-credentials/ || true)
            fi

            if [ -n "${role_name}" ]; then
              echo 'EC2 IAM role: attached'
            else
              echo 'EC2 IAM role: not attached or metadata unavailable'
            fi

            if command -v aws >/dev/null 2>&1 && [ -n "${role_name}" ]; then
              aws rds describe-db-instances --region us-east-1 \
                --query 'DBInstances[].{identifier:DBInstanceIdentifier,status:DBInstanceStatus,endpoint:Endpoint.Address}' \
                --output table || true
            else
              echo 'RDS inventory: unavailable from this instance'
            fi
